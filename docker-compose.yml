services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=entera_db
    ports:
      - "5432:5432"
    networks:
      - appnet

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/entera_db
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - appnet

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge